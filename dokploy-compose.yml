# Dokploy compose: deployed at ai-logist.holy-water.app
# Dokploy's Traefik terminates TLS and forwards HTTPS -> ailogist-caddy:80 (single-domain layout).
# Caddy then routes /api/*, /webhook/*, /ws/* -> ailogist-api:3000; rest -> ailogist-web:3001
# (see Caddyfile).
#
# Service names are project-prefixed because Caddy lives on dokploy-network too
# (for Traefik routing), and short names like 'api'/'web' collide with other
# Dokploy stacks' aliases on that shared network → Docker DNS returns the wrong IP.
# NO host port bindings — Traefik already occupies 80/443 on the VPS.

services:
  ailogist-postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ailogist
      POSTGRES_USER: ailogist
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ailogist -d ailogist']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always

  ailogist-redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: always

  ailogist-api:
    # Image is built by GHA (.github/workflows/build-and-deploy.yml) and pushed
    # to GHCR. Dokploy pulls + recreates instead of building on the VPS, which
    # used to peg both vCPUs and stall the Dokploy panel during deploys.
    image: ghcr.io/mahooo0/ai-logist-api:latest
    pull_policy: always
    depends_on:
      ailogist-postgres:
        condition: service_healthy
      ailogist-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://ailogist:${DB_PASSWORD}@ailogist-postgres:5432/ailogist?sslmode=disable
      REDIS_URL: redis://ailogist-redis:6379
      LOG_LEVEL: info
      VERSION: ${VERSION:-dokploy}
      # Phase 2 — LLM (optional at boot; AnthropicLlmClient throws only when invoked in prod)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-claude-sonnet-4-7}
      LLM_TOKEN_BUDGET_PER_LEAD: ${LLM_TOKEN_BUDGET_PER_LEAD:-30000}
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
      NOMINATIM_CONTACT_EMAIL: ${NOMINATIM_CONTACT_EMAIL:-demo@ai-logist.local}
      # Phase 3 — Telegram (optional; requireTelegramConfig() asserts at plugin boundary)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME}
      TELEGRAM_PUBLIC_URL: ${TELEGRAM_PUBLIC_URL:-https://ai-logist.holy-water.app}
      TELEGRAM_SET_WEBHOOK_ON_BOOT: ${TELEGRAM_SET_WEBHOOK_ON_BOOT:-false}
      # Phase 3.1 — Voice (optional)
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_WEBHOOK_SIGNATURE_SECRET: ${TWILIO_WEBHOOK_SIGNATURE_SECRET}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID}
      ELEVENLABS_AGENT_ID_CONFIRM: ${ELEVENLABS_AGENT_ID_CONFIRM}
      ELEVENLABS_PHONE_NUMBER_ID: ${ELEVENLABS_PHONE_NUMBER_ID}
      ELEVENLABS_WEBHOOK_SECRET: ${ELEVENLABS_WEBHOOK_SECRET}
      VOICE_PUBLIC_URL: ${VOICE_PUBLIC_URL:-https://ai-logist.holy-water.app}
      # Phase 6 / voice-confirm demo flow
      DEMO_CLIENT_PHONE: ${DEMO_CLIENT_PHONE}
      DEMO_TICKER_ENABLED: ${DEMO_TICKER_ENABLED:-false}
      DEMO_TICKER_INTERVAL_SEC: ${DEMO_TICKER_INTERVAL_SEC:-30}
      DEMO_TICKER_DELTA_PCT: ${DEMO_TICKER_DELTA_PCT:-10}
      ADMIN_API_SECRET: ${ADMIN_API_SECRET}
      # Phase 6 — Stripe (optional; sendPaymentLink falls back to manager_active when unset)
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PRICE_CURRENCY: ${STRIPE_PRICE_CURRENCY:-rub}
      STRIPE_SUCCESS_URL: ${STRIPE_SUCCESS_URL}
      STRIPE_CANCEL_URL: ${STRIPE_CANCEL_URL}
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/api/health']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  ailogist-web:
    image: ghcr.io/mahooo0/ai-logist-web:latest
    pull_policy: always
    depends_on:
      - ailogist-api
    environment:
      NODE_ENV: production
      PORT: 3001
      API_INTERNAL_URL: http://ailogist-api:3000
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      AUTH_COOKIE_SECRET: ${AUTH_COOKIE_SECRET}
    expose:
      - '3001'
    restart: always

  ailogist-caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile.dokploy:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    expose:
      - '80'
    depends_on:
      - ailogist-api
      - ailogist-web
    restart: always
    # Dokploy attaches the domain-bound service to its dokploy-network for
    # Traefik routing. Explicitly include the compose default network so
    # Caddy can still resolve ailogist-api:3000 / ailogist-web:3001 upstream.
    networks:
      - default
      - dokploy-network

networks:
  default:
  dokploy-network:
    external: true

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
